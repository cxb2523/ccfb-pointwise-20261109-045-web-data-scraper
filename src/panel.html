<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <title>Page Text Extractor</title>
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <div class="app">
    <h1>Page Text</h1>
    <p class="subtitle">Visible text from the current page without code blocks.</p>

    <textarea id="output" readonly placeholder="Loading page text..."></textarea>

    <div class="actions">
      <button id="refreshBtn" type="button">Refresh</button>
      <button id="copyBtn" type="button">Copy</button>
    </div>

    <p id="status" class="status"></p>

    <hr />

    <h2>Paginated / Scroll Scrape</h2>
    <p class="subtitle">Repeatedly captures, merges and de-dupes items while scrolling or paginating.</p>

    <div class="scrape-config">
      <label>
        Max pages/scrolls
        <input id="maxPagesInput" type="number" min="1" value="20" />
      </label>
      <label>
        Max idle rounds
        <input id="maxIdleRoundsInput" type="number" min="1" value="2" />
      </label>
      <label>
        Wait timeout (ms)
        <input id="waitTimeoutInput" type="number" min="100" step="100" value="8000" />
      </label>
    </div>

    <div class="actions">
      <button id="startScrapeBtn" type="button">Start Scrape</button>
      <button id="cancelScrapeBtn" type="button" disabled>Cancel</button>
    </div>

    <p id="scrapeStatus" class="status"></p>
    <textarea id="scrapeResult" readonly placeholder="Scraped items will appear here..."></textarea>
  </div>

  <script src="panel.js"></script>
</body>
</html>
